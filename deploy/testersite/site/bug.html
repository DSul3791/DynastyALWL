<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit a bug</title>
<!-- The tester site's bug form (deploy/testersite). Dave 23 Nov 2026: "ridiculously simple"; the build is filled in from /latest.json. -->
<link rel="stylesheet" href="/css/dynasty.css">
<script src="/js/tester.js" defer></script>
</head>
<body>
  <div class="who"></div>
  <div class="hero short"><img src="/images/hero.jpg" alt="" width="1330" height="760"></div>
  <main class="form-page">
    <section class="panel">
      <a class="back" href="/">&larr; Front page</a>
      <h1>Submit a bug</h1>
      <form data-kind="bug">
        <div class="field">
          <label for="build">Build</label>
          <input type="text" id="build" name="build" placeholder="Build 9250" maxlength="200" required>
        </div>
        <div class="field">
          <label for="title">Short title</label>
          <input type="text" id="title" name="title" maxlength="120" placeholder="Froze when opening the inventory">
        </div>
        <div class="field">
          <label for="what">What happened?</label>
          <textarea id="what" name="what" required maxlength="20000"></textarea>
        </div>
        <div class="field">
          <label for="files">Attach files <span class="opt">(optional)</span></label>
          <span class="hint">Your game log, a crash report or screenshots. The log is <code>godot.log</code> in
            <code class="path">%APPDATA%\Godot\app_userdata\Dynasty a life well lived\logs</code></span>
          <input type="file" id="files" name="files" multiple>
        </div>
        <button class="button wide" type="submit" data-label="Submit bug">Submit bug</button>
      </form>
      <div class="result" id="result" role="status"></div>
    </section>
    <footer><span class="mark">Dynasty &middot; A Life Well Lived</span>Thank you for testing.</footer>
  </main>
</body>
</html>
