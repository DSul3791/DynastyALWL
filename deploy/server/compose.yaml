# The Dynasty game server on the gaming server (server/client split plan step C4). deploy/server/SERVER.md has the steps.
#   docker compose -f compose.yaml up -d      start (and start again after a reboot, unless it was stopped by hand)
#   docker compose -f compose.yaml down       stop: the server saves and closes within the 90 s grace
# DYNASTY_TAG picks the image (default latest), for example DYNASTY_TAG=build-7979 to go back to a build.
name: dynasty   # fixed, so the volume is dynasty_dynasty-data whatever folder this file is in

services:
  dynasty-server:
    image: dynasty-server:${DYNASTY_TAG:-latest}
    container_name: dynasty-server
    restart: unless-stopped
    ports:
      - "24600:24600/udp"   # the game
      - "24601:24601/tcp"   # ground blocks (port + 1)
    volumes:
      - dynasty-data:/data  # the world's store, characters, admin.json and logs: kept across restarts and new images
    environment:
      DYNASTY_SERVER_PASSWORD: ${DYNASTY_SERVER_PASSWORD:-}   # optional join password (SERVER.md step 5); empty = the store's server.json decides
    # No cpus: quota here: a quota pause stops every server thread at once (50 ms stalls on David4). To limit CPUs use a
    # dedicated set instead, for example  cpuset: "6-11"  (SERVER.md, CPUs).
    stop_grace_period: 90s  # docker stop sends TERM, run_server.sh asks the server to save; past this docker kills it unsaved

volumes:
  dynasty-data:
