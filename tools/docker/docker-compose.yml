# Test box: limited CPU/RAM, no ports, its own volumes. Does not touch any other container.
# Run from the repo root:  docker compose -f tools/docker/docker-compose.yml run --rm testbox <command>
services:
  testbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: dynasty-testbox
    container_name: dynasty-testbox
    cpus: 2
    mem_limit: 8g              # the server has about 13 GiB free (18 of 31 GiB used by the games)
    memswap_limit: 8g
    pids_limit: 512
    cpu_shares: 128            # lowest priority when the game containers want the CPU
    network_mode: bridge       # outbound only (git fetch); no ports published
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, utility, compute, display]   # needs the NVIDIA Container Toolkit on the host
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      REPO_URL: git@github.com:DSul3791/DynastyALWL.git
      BRANCH: claude/generator-v2
      DEV_BRANCH: claude/dave-box
      GIT_NAME: ${GIT_NAME:-Dynasty dev box}
      GIT_EMAIL: ${GIT_EMAIL:-devbox@example.invalid}
      JOB_TIMEOUT_S: "900"
    volumes:
      # Server convention: everything under /data/godot (the 389 GB game drive). Set GODOT_DIR to change it.
      - ${GODOT_DIR:-/data/godot}/projects/dynasty:/work/repo   # the checkout: survives container recreation
      - ${GODOT_DIR:-/data/godot}/box/ssh:/home/tester/.ssh      # the deploy key (private part never leaves the server)
      - ${GODOT_DIR:-/data/godot}/box/out:/out                   # logs and reports
      - ${GODOT_DIR:-/data/godot}/box/claude:/home/tester/.claude-box   # Claude Code sign-in and settings (stay on the server)

  # "David3": Claude Code in remote-control mode inside the same box, so the project can send it test jobs.
  # Start it only after the first interactive sign-in (see README); after that it starts by itself on boot.
  david3:
    extends: testbox
    container_name: dynasty-david3
    stdin_open: true
    tty: true
    command: ["claude", "remote-control", "--name", "David3 test box", "--spawn", "same-dir"]
    working_dir: /work/repo
    restart: unless-stopped   # comes back after a reboot; stop with: docker compose stop david3
