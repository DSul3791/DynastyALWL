name: merge guard
permissions:
  contents: read
  pull-requests: read
on:
  push:
    branches: ["main", "dev"]
  pull_request:
jobs:
  merge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The bought animal models (Git LFS) are not needed here: no LFS download and no assets/animals in the checkout (tools/skip_models.sh).
          lfs: false
          sparse-checkout: |
            /*
            !/assets/animals/
          sparse-checkout-cone-mode: false
      - name: Run merge guard against the commit before this push
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BASE_REF" ]; then
            export MERGE_CHECK_BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            export MERGE_CHECK_BASE="$BEFORE"
          fi
          echo "MERGE_CHECK_BASE=${MERGE_CHECK_BASE:-origin/dev}" >> "$GITHUB_ENV"   # the watched checks step reads the same base
          python3 tools/merge_check.py
      - name: Watched checks (warn, then block on the 3rd flag; docs/RULINGS.md R-TEAM-WARN-TO-BLOCK)
        if: ${{ !cancelled() }}   # its warnings show even when an earlier step failed
        run: python3 -I tools/warn_watch.py
      - name: Deletion rule tests (Decision 61, no Godot)
        run: python3 -I tools/test_deletion_rules.py
      - name: AI team operating system static check (no Godot, no Claude run)
        run: python3 -I tools/check_ai_team_package.py
      - name: AI team package regression checks (isolated fixtures, no Godot)
        run: python3 -I tools/test_ai_team_package.py
      - name: Document expiry regression checks (isolated Git fixtures, no Godot)
        run: python3 -I tools/test_doc_retirement.py
