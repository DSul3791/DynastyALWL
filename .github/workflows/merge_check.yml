name: merge guard
on:
  push:
    branches: ["claude/generator-v2"]
  pull_request:
jobs:
  merge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch generator-v2 for comparison
        run: git fetch origin claude/generator-v2:refs/remotes/origin/claude/generator-v2 || true
      - name: Run merge guard
        run: python3 tools/merge_check.py
